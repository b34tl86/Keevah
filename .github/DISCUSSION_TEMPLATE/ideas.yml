body:
  - type: markdown
    attributes:
      value: |
        Ideas here help decide what Keevah does next. Before you post, look at the [roadmap](https://github.com/b34tl86/Keevah-AI/blob/main/ROADMAP.md) and search the ideas already here: a 👍 on an existing one counts too.

        **Keep customer data out:** no callers' names or numbers, transcripts or recordings.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Keeva or the dashboard to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: Who would it help, and how often? A real example, with the names changed, helps most.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of Keevah?
      options:
        - Calls and the receptionist
        - The dashboard
        - Call logs
        - Knowledge
        - Settings and setup
        - Phone systems
        - Emails and alerts
        - Something else
