<text x="64" y="150" class="eyebrow">AI PHONE RECEPTIONIST FOR GRANDSTREAM AND YEASTAR</text>
<text x="62" y="214" class="h1">Answers like your</text>
<text x="62" y="278" class="h1">best colleague.</text>
<text x="64" y="326" class="sub">Keeva picks up in a natural voice, puts callers through,</text>
<text x="64" y="356" class="sub">takes messages and answers from your own knowledge.</text>
