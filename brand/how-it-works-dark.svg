<text x="32" y="114" class="lab">THE CALL</text>
<text x="32" y="140" class="title">A caller rings</text>
<text x="32" y="164" class="body">Your usual number,</text>
<text x="32" y="186" class="body">at any hour.</text>
<text x="208" y="114" class="lab">YOUR PHONE SYSTEM</text>
<text x="208" y="140" class="title">Passes it to Keevah</text>
<text x="208" y="164" class="body">Grandstream or Yeastar,</text>
<text x="208" y="186" class="body">over a SIP trunk.</text>
<text x="424" y="114" class="lab">KEEVAH</text>
<text x="424" y="140" class="title">Keeva answers</text>
<text x="424" y="164" class="body">In a natural voice, then:</text>
<text x="684" y="114" class="lab">YOUR TEAM</text>
<text x="684" y="140" class="title">Sees every call</text>
<text x="684" y="164" class="body">Live, and after it ends:</text>
<rect x="424.5" y="184.5" width="239" height="107" rx="6" fill="#0f1317" stroke="#2c333b"/>
<clipPath id="panel"><rect x="424" y="184" width="240" height="108" rx="6"/></clipPath>
<rect x="424" y="184" width="4" height="108" fill="#f2b705" clip-path="url(#panel)"/>
<circle cx="446" cy="202" r="4" fill="#8cc4f5"/>
<text x="458" y="207" class="prow">Puts the caller through</text>
<rect x="428" y="220" width="235" height="1" fill="#3a414c"/>
<circle cx="446" cy="238" r="4" fill="#f3c064"/>
<text x="458" y="243" class="prow">Takes a message</text>
<rect x="428" y="256" width="235" height="1" fill="#3a414c"/>
<circle cx="446" cy="274" r="4" fill="#74d6a3"/>
<text x="458" y="279" class="prow">Answers from knowledge</text>
<rect x="684.5" y="184.5" width="243" height="107" rx="6" fill="#1c2127" stroke="#2c333b"/>
<circle cx="702" cy="202" r="4" fill="#a6afb9"/>
<text x="714" y="207" class="row">Live on the dashboard</text>
<rect x="685" y="220" width="242" height="1" fill="#262c33"/>
<circle cx="702" cy="238" r="4" fill="#a6afb9"/>
<text x="714" y="243" class="row">Log and transcript</text>
<rect x="685" y="256" width="242" height="1" fill="#262c33"/>
<circle cx="702" cy="274" r="4" fill="#a6afb9"/>
<text x="714" y="279" class="row">Summary by email</text>
</svg>
