<svg xmlns="http://www.w3.org/2000/svg" width="960" height="324" viewBox="0 0 960 324" role="img" aria-labelledby="title desc">
<title id="title">How Keevah works</title>
<desc id="desc">A caller rings the organisation's usual number. Its Grandstream or Yeastar phone system passes the call to Keevah. Keeva answers in a natural voice, then puts the caller through, takes a message or answers from the organisation's own knowledge. The team sees every call live on the dashboard, with a log, a transcript and a summary by email.</desc>
<style>
text{font-family:'Fira Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif}
.lab{font-size:12px;font-weight:600;letter-spacing:.08em;fill:#a6afb9}
.title{font-size:17px;font-weight:600;fill:#e8ebee}
.body{font-size:15px;fill:#a6afb9}
.row{font-size:15px;fill:#e8ebee}
.prow{font-size:15px;fill:#dde1e5}
</style>
