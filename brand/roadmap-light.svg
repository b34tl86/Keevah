<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1196" viewBox="0 0 960 1196" role="img" aria-labelledby="title desc">
<title id="title">Keevah roadmap</title>
<desc id="desc">Keevah roadmap. v0.9 Group dashboard and reception settings (shipped); v1.0 Knowledge base and commercial launch pack: Usage &amp; AI cost · AI notice · setup checklist and test calls · invites · backups · outage alerts (shipped); v1.1–1.9 Transfers, staff by name and updates: Cold or warm transfers · ask for a person by name · staff dial out · update from the dashboard (shipped); v1.10–1.13 Roles, live calls and backups from the dashboard: Settings a page per job · custom roles · take a live call · backups to a NAS or the cloud (shipped); v1.14–1.15 Waiting audio and safer updates: Waiting audio · staff recognition · back up before updating · roll back from the dashboard (shipped); v1.16 Calendars, contacts and integrations: Appointment booking · returning callers and Contacts · spam and robocall blocking · frustrated callers offered a person · webhooks and API · caller data requests (shipped); Arabic and other languages on calls (now); Data residency: Where call data is processed, and in-country options (now); Built-in Asterisk, Keevah Connector and installers: For Windows, macOS and Linux, with signed packages (next); Call recording: Playback, retention and a notice to callers (next); Concurrent call limits: Per organisation and per server (next); Licensing: A licence for each Keevah server (next); SMS and WhatsApp messages: Confirmations for callers, and alerts for your team (later); Themes: Your branding, colours and fonts, and ready-made themes (later); Signed updates and audited support access (later); techtrust.ae product website (later); Android app for personal calls (later).</desc>
