<title id="title">Keevah roadmap</title>
<desc id="desc">Keevah roadmap. v0.9 Group dashboard and reception settings (shipped); v1.0 Knowledge base and commercial launch pack: usage &amp; AI cost, AI notice, setup checklist and test calls, invites, backups, outage alerts (shipped); v1.1 Cold or warm transfers per department (now); v1.2 Built-in Asterisk, Keevah Connector and installers: for Windows, macOS and Linux (next); techtrust.ae product website (later); Daily-use dashboard: messages inbox, live updates, weekly reports (later); WhatsApp confirmations and alerts (later); Booking and integrations: calendars, webhooks, CRM (later); Android app for personal calls (later).</desc>
