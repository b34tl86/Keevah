<title id="title">Keevah: answers like your best colleague</title>
<desc id="desc">Keevah, the AI phone receptionist by TechTrust. On the left, the Keevah logo and the line 'Answers like your best colleague.' On the right, the Keevah board: calls are being answered, Keeva is putting a caller through to Accounts, and the organisation's day strip shows today's calls.</desc>
