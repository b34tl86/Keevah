<text x="64" y="214" class="s-eyebrow">AI RECEPTIONIST · GRANDSTREAM · YEASTAR</text>
<text x="61" y="290" class="s-h1">Answers like your</text>
<text x="61" y="364" class="s-h1">best colleague.</text>
<text x="64" y="424" class="s-sub">Keeva answers your calls in a natural voice,</text>
<text x="64" y="456" class="s-sub">puts callers through, takes messages and</text>
<text x="64" y="488" class="s-sub">answers from your own knowledge.</text>
<text x="64" y="584" class="s-foot">Made by <tspan class="s-foot-b">TechTrust</tspan> · techtrust.ae</text>
